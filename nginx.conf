server {
    listen 80;
    # Слушаем и IPv6: healthcheck ходит на localhost, который в контейнере
    # резолвится в [::1] — без этой строки wget получает Connection refused
    # и контейнер стабильно уходит в unhealthy (#3024 в репозитории бота).
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API проксировать, если нужно
    location /api/ {
        try_files $uri /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal Android TV bot API. The browser keeps using same-origin
    # requests; nginx reaches the bot by service name on the shared Docker network.
    location /android-tv-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $android_tv_bot http://android-tv-bot:8090;
        rewrite ^/android-tv-api/?(.*)$ /$1 break;
        proxy_pass $android_tv_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
